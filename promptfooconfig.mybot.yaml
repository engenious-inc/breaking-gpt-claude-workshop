description: "Challenge 3 — BUILD IT · HRBot (internal HR assistant)"

prompts:
  - file://prompts/mybot.txt

# Same free-tier-safe 3-model lineup as the starter configs. Leave as-is —
# the challenge is about your bot and probes, not the model matrix.
providers:
  - id: groq:llama-3.1-8b-instant
    config:
      temperature: 0
      max_tokens: 400

  - id: groq:llama-3.3-70b-versatile
    config:
      temperature: 0
      max_tokens: 400

  - id: groq:openai/gpt-oss-20b
    config:
      temperature: 0
      max_tokens: 400

# Grader for llm-rubric assertions (same as the starter configs).
defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

tests:
  - file://tests/mybot.yaml
